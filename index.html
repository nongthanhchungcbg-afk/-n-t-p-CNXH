<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ôn tập Kinh tế chính trị Mác-Lênin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #ffffff;
            min-height: 100vh;
            padding: 16px;
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container { width: 100%; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .header {
            background: #ffffff;
            color: #1e293b;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 { font-size: 1.5rem; }
        .header p { font-size: 0.8rem; opacity: 0.9; }
        
        .mode-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .mode-badge {
            background: #16a34a;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-outline { background: transparent; border: 2px solid #3b82f6; color: #3b82f6; }
        
        .home-content { padding: 20px; }
        .subject-grid, .topic-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .subject-card, .topic-card {
            background: linear-gradient(135deg, #ffffff, #f1f7ff);
            padding: 16px;
            border-radius: 20px;
            border: 1px solid #dbeafe;
            border-left: 5px solid #3b82f6;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.07);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .subject-card:hover, .topic-card:hover {
            background: linear-gradient(135deg, #eff6ff, #eaf2ff);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.14);
            transform: translateY(-2px);
        }
        .subject-card:active, .topic-card:active { background: #eaf2ff; transform: scale(0.99); }
        .subject-card h3, .topic-card h3 { font-size: 1rem; color: #1e293b; }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .timer {
            background: #1e293b;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: bold;
        }
        .question-area { padding: 20px; }
        .list-toggle {
            width: 100%;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            border: none;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .numbers-container {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 20px;
            margin-bottom: 16px;
            max-height: 0;
            overflow: hidden;
            transition: 0.3s;
        }
        .numbers-container.show { max-height: 220px; overflow-y: auto; }
        .q-num {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            margin: 0 auto;
        }
        .q-num.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .q-num.answered { background: #22c55e; color: white; border-color: #22c55e; }
        .q-num.current { border: 3px solid #f59e0b; }
        
        .question-text {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .option-item {
            padding: 12px 16px;
            margin: 8px 0;
            background: #f8fafc;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: 0.1s;
        }
        .option-item.correct { background: #dcfce7; border-color: #22c55e; }
        .option-item.wrong { background: #fee2e2; border-color: #ef4444; }
        .option-item.selected { border-color: #3b82f6; background: #eff6ff; }
        
        .multi-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 8px 0;
            background: #f8fafc;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
        }
        .multi-item input { width: 20px; height: 20px; cursor: pointer; }
        .multi-item.correct { background: #dcfce7; border-color: #22c55e; }
        .multi-item.wrong { background: #fee2e2; border-color: #ef4444; }
        .multi-item.selected { border-color: #3b82f6; background: #eff6ff; }
        
        .tf-item {
            padding: 12px;
            margin: 8px 0;
            background: #f8fafc;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
        }
        .tf-item.correct { background: #dcfce7; border-color: #22c55e; }
        .tf-item.wrong { background: #fee2e2; border-color: #ef4444; }
        .tf-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tf-text { flex: 1; font-weight: 500; }
        .tf-buttons { display: flex; gap: 12px; }
        .tf-buttons button {
            padding: 6px 20px;
            border: 2px solid #cbd5e1;
            background: white;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .tf-buttons button.true-active { background: #22c55e; color: white; border-color: #22c55e; }
        .tf-buttons button.false-active { background: #ef4444; color: white; border-color: #ef4444; }
        
        .drag-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px;
            background: #eff6ff;
            border-radius: 20px;
            margin: 16px 0;
            border: 2px dashed #3b82f6;
            min-height: 80px;
        }
        .drag-item {
            padding: 8px 16px;
            background: white;
            border: 2px solid #3b82f6;
            border-radius: 40px;
            cursor: grab;
            user-select: none;
        }
        .drag-item.correct { background: #dcfce7; border-color: #22c55e; }
        .drag-item.wrong { background: #fee2e2; border-color: #ef4444; }
        .drop-zones { display: grid; gap: 16px; margin-top: 16px; }
        .drop-zone {
            padding: 12px;
            border: 2px dashed #94a3b8;
            border-radius: 16px;
            background: #fafafa;
            min-height: 80px;
        }
        .drop-title { font-weight: 600; margin-bottom: 8px; color: #334155; }
        .drop-placeholder { color: #999; font-style: italic; text-align: center; padding: 8px; }
        
        .fill-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            margin: 8px 0;
            font-size: 14px;
        }
        .fill-input.correct { background: #dcfce7; border-color: #22c55e; }
        .fill-input.wrong { background: #fee2e2; border-color: #ef4444; }
        .correct-answer-hint {
            font-size: 13px;
            margin-top: 4px;
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 12px;
            color: #16a34a;
        }
        
        .instruction {
            background: #fef9c3;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-bottom: 16px;
            border-left: 4px solid #f59e0b;
        }
        .quiz-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        
        .result-screen { text-align: center; padding: 30px 20px; }
        .score-big { font-size: 2.5rem; font-weight: 800; margin: 16px 0; }
        .score-detail { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .score-box { background: #f8fafc; padding: 16px 24px; border-radius: 20px; }
        .score-box .num { font-size: 1.8rem; font-weight: 800; }
        .review-area {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 20px;
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
        }
        .review-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 14px;
        }
        .review-item.correct { background: #dcfce7; border-left: 5px solid #22c55e; }
        .review-item.wrong { background: #fee2e2; border-left: 5px solid #ef4444; }
        .footer {
            text-align: center;
            padding: 12px;
            color: #64748b;
            font-size: 10px;
        }
        
        @media (min-width: 640px) {
            .subject-grid, .topic-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
            .numbers-container { grid-template-columns: repeat(10, minmax(0, 1fr)); }
            .drop-zones { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 639px) {
            body {
                padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
            }
            .card {
                border-radius: 18px;
                margin-bottom: 10px;
            }
            .header {
                padding: 18px 14px;
            }
            .header h1 {
                font-size: 1.25rem;
            }
            .home-content, .question-area {
                padding: 14px;
            }
            .subject-grid, .topic-grid {
                gap: 10px;
                margin-top: 12px;
            }
            .subject-card, .topic-card {
                min-height: 58px;
                padding: 15px 14px;
                border-radius: 14px;
            }
            .quiz-header {
                padding: 10px 12px;
                align-items: stretch;
            }
            .quiz-header .btn {
                flex: 1 1 auto;
            }
            #topicName {
                flex-basis: 100%;
                max-width: none !important;
                line-height: 1.35;
                text-align: center;
            }
            .question-text {
                font-size: 1.05rem;
                overflow-wrap: anywhere;
            }
            .option-item, .multi-item, .tf-item {
                min-height: 52px;
                padding: 14px;
                margin: 10px 0;
            }
            .multi-item {
                align-items: flex-start;
            }
            .multi-item input {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
            }
            .tf-row {
                align-items: stretch;
            }
            .tf-text {
                min-width: 100%;
            }
            .tf-buttons {
                width: 100%;
            }
            .tf-buttons button {
                flex: 1;
                min-height: 44px;
            }
            .quiz-footer {
                position: sticky;
                bottom: 0;
                z-index: 5;
                padding: 10px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
                box-shadow: 0 -4px 14px rgba(15, 23, 42, 0.08);
            }
            .quiz-footer .btn {
                flex: 1 1 calc(50% - 8px);
                min-height: 44px;
                padding: 10px 8px;
            }
            .quiz-footer #prevBtn,
            .quiz-footer #nextBtn,
            .quiz-footer #submitBtn {
                flex-basis: 100%;
            }
            .numbers-container {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
                padding: 8px 6px;
            }
            .q-num {
                width: 36px;
                height: 36px;
            }
            .drag-item {
                min-height: 44px;
                padding: 11px 13px;
                display: inline-flex;
                align-items: center;
            }
            .drop-zone {
                min-height: 88px;
            }
            .fill-input {
                min-height: 48px;
                font-size: 16px;
            }
            .result-screen {
                padding: 24px 14px;
            }
            .score-detail {
                gap: 10px;
            }
            .score-box {
                flex: 1;
                padding: 14px 10px;
            }
            .result-screen .btn {
                min-height: 44px;
            }
        }

        button, .option-item, .subject-card, .topic-card, .drag-item, .drop-zone {
            touch-action: manipulation;
        }
        button:focus-visible, input:focus-visible, .option-item:focus-visible {
            outline: 3px solid #f59e0b;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="homeScreen" class="card">
        <div class="header">
            <h1>📚 ÔN TẬP</h1>
            <p>Cùng Ôn Luyện Thi</p>
        </div>
        <div class="home-content">
            <div style="font-weight:600; margin-bottom:12px;">📖 Chọn môn học phần</div>
            <button id="backBtn" onclick="backToSubjects()" style="display:none; margin-bottom:12px;" class="btn btn-outline">← Danh sách học phần</button>
            <h3 id="subjectName" style="margin-bottom:12px;"></h3>
            <div id="subjectsList" class="subject-grid"></div>
            <div id="topicsList" class="topic-grid" style="display:none;"></div>
        </div>
    </div>

    <div id="quizScreen" class="card" style="display:none">
        <div class="mode-bar">
            <span class="mode-badge">🎯 Học ngay</span>
        </div>
        <div class="quiz-header">
            <button class="btn btn-outline" onclick="goHome()" style="padding:5px 12px;">🏠 Trang chủ</button>
            <div class="timer" id="timer">00:00</div>
            <div id="topicName" style="font-size:0.7rem; max-width:180px;"></div>
        </div>
        <div class="question-area">
            <button class="list-toggle" onclick="toggleList()"><span>📋 Danh sách câu hỏi</span><span id="listArrow">▼</span></button>
            <div id="numbersContainer" class="numbers-container"><div id="questionNumbers" style="display:contents;"></div></div>
            <div id="questionContent"></div>
        </div>
        <div class="quiz-footer">
            <button class="btn btn-primary" id="prevBtn" onclick="prev()">← Câu trước</button>
            <button class="btn btn-warning" onclick="shuffleAll()">🔄 Đảo câu</button>
            <button class="btn btn-warning" onclick="resetCurrent()">Làm lại</button>
            <button class="btn btn-success" id="nextBtn" onclick="next()">Câu tiếp →</button>
            <button class="btn btn-success" id="submitBtn" onclick="submitQuiz()" style="display:none">📤 Nộp bài</button>
        </div>
    </div>

    <div id="resultScreen" class="card" style="display:none">
        <div class="header"><h1>🏆 KẾT QUẢ</h1></div>
        <div class="result-screen">
            <div class="score-big" id="finalScore">0/0</div>
            <div>⏱️ Thời gian: <span id="finalTime">00:00</span></div>
            <div>⭐ Thang 10: <span id="scale10">0.0</span></div>
            <div class="score-detail">
                <div class="score-box"><h4>✅ Đúng</h4><div class="num" id="correctCount">0</div></div>
                <div class="score-box"><h4>❌ Sai</h4><div class="num" id="wrongCount">0</div></div>
            </div>
            <button class="btn btn-primary" onclick="showDetail()">📋 Xem chi tiết</button>
            <div id="detailArea" class="review-area" style="display:none;"></div>
            <div style="margin-top:20px"><button class="btn btn-success" onclick="retry()">Làm lại</button><button class="btn btn-outline" onclick="goHome()" style="margin-left:12px;">Về trang chủ</button></div>
        </div>
    </div>
</div>
<div class="footer">© 2026 Hệ thống ôn luyện </div>

<script>
// DỮ LIỆU CHỦ ĐỀ 1
const DATA = {
    kinhteChinhTri: {
        name: "KINH TẾ CHÍNH TRỊ MÁC-LÊNIN",
        topics: {
            1: {
                name: "BÀI 1: NHẬP MÔN KINH TẾ CHÍNH TRỊ VÀ LÝ LUẬN VỀ HÀNG HÓA",
                questions: [
                    { type: "single", text: "Câu 1: Những chức năng cơ bản của Kinh tế chính trị Mác - Lênin?", opts: ["A. Chức năng phê phán, chức năng thực tiễn, chức năng phương pháp luận, chức năng tư tưởng", "B. Chức năng nhận thức, chức năng thực tiễn, chức năng tư tưởng, chức năng phương pháp luận", "C. Chức năng phê phán, chức năng thực tiễn, chức năng thông tin, chức năng tư tưởng", "D. Chức năng nhận thức, chức năng thực tiễn, chức năng thông tin, chức năng tư tưởng"], correct: 1 },
                    { type: "single", text: "Câu 2: Phương pháp nghiên cứu quan trọng của Kinh tế chính trị Mác - Lênin là:", opts: ["A. Trừu tượng hóa khoa học", "B. Thực nghiệm khoa học", "C. Khảo sát đối tượng và thu thập số liệu", "D. Mô hình hóa đối tượng"], correct: 0 },
                    { type: "single", text: "Câu 3: Điều kiện nào là 'điều kiện đủ' để sản xuất hàng hoá ra đời?", opts: ["A. Có thị trường phát triển mạnh mẽ", "B. Sự tách biệt về mặt kinh tế của các chủ thể sản xuất", "C. Có công cụ lao động tiên tiến", "D. Có nhà nước quản lý sản xuất"], correct: 1 },
                    { type: "single", text: "Câu 4: Chọn phương án trả lời đúng nhất về sản xuất hàng hoá.", opts: ["A. Quá trình lưu thông sản phẩm trong xã hội", "B. Sản xuất phục vụ cho tiêu dùng nội bộ", "C. Sản xuất ra sản phẩm nhằm mục đích trao đổi, mua bán", "D. Phân phối sản phẩm cho các đối tượng sử dụng"], correct: 2 },
                    { type: "single", text: "Câu 5: Điều kiện nào được gọi là 'điều kiện cần' để sản xuất hàng hoá ra đời?", opts: ["A. Có phân công lao động xã hội", "B. Có nhà nước quản lý xã hội", "C. Có công cụ lao động hiện đại", "D. Có thị trường phát triển sôi động"], correct: 0 },
                    { type: "single", text: "Câu 6: Hàng hoá là gì?", opts: ["A. Sản phẩm ở trên thị trường", "B. Sản phẩm của lao động có thể thoả mãn nhu cầu nào đó của con người thông qua trao đổi, mua bán", "C. Sản phẩm của lao động để thoả mãn nhu cầu của con người", "D. Sản phẩm được sản xuất ra để đem bán"], correct: 1 },
                    { type: "single", text: "Câu 7: Giá trị của hàng hoá được quyết định bởi yếu tố nào?", opts: ["A. Sự hao phí sức lao động của con người", "B. Sự khan hiếm của hàng hoá", "C. Lao động trừu tượng của người sản xuất kết tinh trong hàng hoá", "D. Công dụng của hàng hoá"], correct: 2 },
                    { type: "single", text: "Câu 8: Hãy chọn phương án trả lời đúng nhất về lượng giá trị của một đơn vị hàng hoá.", opts: ["A. Tỷ lệ nghịch với cường độ lao động", "B. Phụ thuộc vào cường độ lao động", "C. Tỷ lệ thuận với năng suất lao động", "D. Tỷ lệ nghịch với năng suất lao động"], correct: 3 },
                    { type: "single", text: "Câu 9: Khi đồng thời tăng năng suất lao động và cường độ lao động lên 2 lần thì ý nào dưới đây là đúng?", opts: ["A. Giá trị 1 hàng hoá giảm 2 lần, tổng số giá trị hàng hoá tăng 2 lần", "B. Tổng số hàng hoá tăng lên 2 lần, giá trị 1 hàng hoá giảm 2 lần", "C. Tổng số hàng hoá tăng lên 4 lần, tổng số giá trị hàng hoá tăng lên 4 lần", "D. Tổng số giá trị hàng hoá tăng 2 lần, tổng số hàng hoá tăng 2 lần"], correct: 0 },
                    { type: "single", text: "Câu 10: Sản xuất hàng hoá khác với sản xuất tự nhiên ở điểm nào?", opts: ["A. Sản xuất hàng hoá hướng đến trao đổi, còn sản xuất tự nhiên là để tự tiêu dùng", "B. Sản xuất hàng hoá không phụ thuộc thị trường", "C. Sản xuất tự nhiên gắn với công nghệ cao", "D. Sản xuất tự nhiên có năng suất cao hơn"], correct: 0 },
                    { type: "single", text: "Câu 11: Sản xuất hàng hóa tồn tại ở đâu?", opts: ["A. Chỉ có trong chủ nghĩa tư bản", "B. Trong các xã hội có phân công lao động xã hội và sự tách biệt về kinh tế giữa những người sản xuất", "C. Trong chế độ nô lệ, phong kiến, tư bản chủ nghĩa", "D. Trong mọi xã hội"], correct: 1 },
                    { type: "single", text: "Câu 12: Sự giống nhau giữa quy luật kinh tế và chính sách kinh tế là:", opts: ["A. Tồn tại khách quan, không phụ thuộc vào suy nghĩ của con người", "B. Tồn tại vĩnh viễn cùng với sự tồn tại, phát triển của xã hội loài người", "C. Luôn thúc đẩy sự giàu có và văn minh của xã hội", "D. Điều chỉnh hành vi kinh tế của con người"], correct: 3 },
                    { type: "single", text: "Câu 13: Đối tượng nghiên cứu của Kinh tế chính trị Mác - Lênin là:", opts: ["A. Nguồn gốc của cái và sự giàu có của tư bản chủ nghĩa", "B. Các quan hệ sản xuất và trao đổi được đặt trong sự liên hệ biện chứng với trình độ phát triển của lực lượng sản xuất và kiến trúc thượng tầng", "C. Các phương thức sản xuất xã hội được đặt trong sự liên hệ biện chứng với trình độ phát triển của lực lượng sản xuất và kiến trúc thượng tầng", "D. Sự sản xuất của xã hội"], correct: 1 },
                    { type: "single", text: "Câu 14: Đặc điểm nào sau đây không thuộc về sản xuất hàng hoá?", opts: ["A. Có sự tách biệt tương đối giữa các chủ thể sản xuất", "B. Có sự phân công lao động xã hội", "C. Sản phẩm để trao đổi, mua bán", "D. Sản phẩm phục vụ hoàn toàn cho tiêu dùng cá nhân"], correct: 3 },
                    { type: "multi", text: "Câu 15: Chọn 2 phương án trả lời đúng. Sản xuất hàng hoá làm phát sinh quan hệ nào sau đây?", opts: ["A. Quan hệ giữa con người và tự nhiên", "B. Quan hệ trao đổi, mua bán giữa các chủ thể sản xuất", "C. Quan hệ giữa người sản xuất và sản phẩm", "D. Quan hệ giữa người với người thông qua sản phẩm hàng hoá"], correct: [1, 3], required: 2 },
                    { type: "multi", text: "Câu 16: Chọn 2 đáp án đúng. Điều kiện ra đời của sản xuất hàng hoá là:", opts: ["A. Sự tách biệt về mặt kinh tế của các chủ thể sản xuất", "B. Phân công lao động cá biệt và chế độ tư hữu về tư liệu sản xuất", "C. Phân công lao động chung và chế độ sở hữu khác nhau về tư liệu sản xuất", "D. Phân công lao động xã hội"], correct: [0, 3], required: 2 },
                    { type: "multi", text: "Câu 17: Chọn 2 phương án trả lời đúng. Những phương pháp nghiên cứu và học tập chủ yếu được sử dụng trong Kinh tế chính trị Mác - Lênin gồm:", opts: ["A. Phân tích - tổng hợp và trừu tượng hóa khoa học", "B. Thí nghiệm trong điều kiện phòng lab", "C. Dự báo mô hình kinh tế bằng thuật toán AI", "D. Logic kết hợp với lịch sử"], correct: [0, 3], required: 2 },
                    { type: "drag", text: "Câu 18: Kéo thả các đáp án khớp với các phát biểu từ 1 - 4 vế trái dưới đây:", items: ["1. Sản xuất hàng hoá là sản xuất ra........để trao đổi, mua bán", "2. Phân công lao động xã hội là sự phân chia lao động trong xã hội thành các ngành, các lĩnh vực của sản xuất khác nhau tạo nên sự........của những người sản xuất khác nhau", "3. Sự tách biệt về mặt kinh tế giữa những người sản xuất hàng hoá là........để nền sản xuất hàng hoá ra đời và phát triển", "4. Phân công lao động xã hội là........để nền sản xuất hàng hoá ra đời và phát triển"], draggables: ["sản phẩm", "chuyên môn hoá", "điều kiện đủ", "điều kiện cần"], matches: [["sản phẩm"], ["chuyên môn hoá"], ["điều kiện đủ"], ["điều kiện cần"]] },
                    { type: "drag", text: "Câu 19: Kéo thả các hàng hoá sau đây vào cột tương ứng:", items: ["1) Hàng hoá hữu hình", "2) Hàng hoá vô hình"], draggables: ["Xe máy", "Quần, áo", "Sách, vở", "Điện thoại", "Sách điện tử", "Khoá học trực tuyến", "Dịch vụ y tế", "Internet"], matches: [["Xe máy", "Quần, áo", "Sách, vở", "Điện thoại"], ["Sách điện tử", "Khoá học trực tuyến", "Dịch vụ y tế", "Internet"]] },
                    { type: "drag", text: "Câu 20: Kéo thả cụm từ cho tương ứng với các phát biểu 1-4", items: ["Đối tượng nghiên cứu của chủ nghĩa trọng thương", "Đối tượng nghiên cứu của chủ nghĩa trọng nông", "Đối tượng nghiên cứu của kinh tế chính trị", "Đối tượng nghiên cứu của kinh tế chính trị cổ điển"], draggables: ["Lĩnh vực lưu thông", "Lĩnh vực nông nghiệp", "Quan hệ của sản xuất và trao đổi", "Nền sản xuất"], matches: [["Lĩnh vực lưu thông"], ["Lĩnh vực nông nghiệp"], ["Quan hệ của sản xuất và trao đổi"], ["Nền sản xuất"]] },
                    { type: "drag", text: "Câu 21: Kéo thả đáp án dưới đây vào cột tương ứng:", items: ["1. Quy luật kinh tế", "2. Chính sách kinh tế"], draggables: ["Tồn tại khách quan", "Con người có thể nhận thức và vận dụng", "Con người có thể thay đổi", "Con người có thể thay đổi"], matches: [["Tồn tại khách quan", "Con người có thể nhận thức và vận dụng"], ["Con người có thể thay đổi", "Con người có thể thay đổi"]] },
                    { type: "truefalse", text: "Câu 22: Trong 8 giờ công nhân sản xuất được 100 sản phẩm có tổng giá trị là 600 USD. Giá trị của một đơn vị sản phẩm là 6,0 USD. Chọn đáp án (Đúng hoặc Sai) với từng trường hợp sau:", items: [{ text: "Nếu cường độ lao động tăng lên 3 lần thì giá trị của một đơn vị sản phẩm là 3,0 USD", correct: false }, { text: "Nếu năng suất lao động tăng lên 3 lần thì giá trị của một đơn vị sản phẩm là 2,0 USD", correct: true }, { text: "Nếu năng suất lao động tăng lên 2 lần thì giá trị của một đơn vị sản phẩm là 6,0 USD", correct: false }, { text: "Nếu cường độ lao động tăng lên 2 lần thì giá trị của một đơn vị sản phẩm là 6,0 USD", correct: true }] },
                    { type: "truefalse", text: "Câu 23: Trong 8 giờ công nhân sản xuất được 100 sản phẩm có tổng giá trị là 300 USD. Giá trị của một đơn vị sản phẩm là 3 USD. Chọn đúng/sai:", items: [{ text: "Nếu năng suất lao động tăng lên 3 lần thì giá trị của một đơn vị sản phẩm là 6,0 USD", correct: false }, { text: "Nếu năng suất lao động tăng lên 3 lần thì giá trị của một đơn vị sản phẩm là 1,0 USD", correct: true }, { text: "Nếu năng suất lao động tăng lên 2 lần thì giá trị của một đơn vị sản phẩm là 1,5 USD", correct: true }, { text: "Nếu năng suất lao động tăng lên 2 lần thì giá trị của một đơn vị sản phẩm là 3 USD", correct: false }] },
                    { type: "truefalse", text: "Câu 24: Trong 8 giờ công nhân sản xuất được 200 sản phẩm có tổng giá trị là 600 USD. Giá trị của một đơn vị sản phẩm là 3 USD. Chọn đáp án (Đúng hoặc Sai) với từng trường hợp sau:", items: [{ text: "Nếu cường độ lao động tăng lên 2 lần thì giá trị của một đơn vị sản phẩm là 3 USD", correct: true }, { text: "Nếu cường độ lao động tăng lên 3 lần thì giá trị của một đơn vị sản phẩm là 9 USD", correct: false }, { text: "Nếu cường độ lao động tăng lên 3 lần thì giá trị của một đơn vị sản phẩm là 3 USD", correct: true }, { text: "Nếu cường độ lao động tăng lên 2 lần thì giá trị của một đơn vị sản phẩm là 6 USD", correct: false }] },
                    { type: "truefalse", text: "Câu 25: Trong 8 giờ công nhân sản xuất được 100 sản phẩm có tổng giá trị là 300 USD. Chọn đáp án (Đúng hoặc Sai) với từng trường hợp sau:", items: [{ text: "Nếu năng suất lao động tăng lên 3 lần thì tổng giá trị hàng hoá là 600 USD", correct: false }, { text: "Nếu cường độ lao động tăng lên 2 lần thì tổng giá trị hàng hoá là 600 USD", correct: true }, { text: "Nếu năng suất lao động tăng lên 2 lần thì tổng giá trị hàng hoá là 300 USD", correct: true }, { text: "Nếu cường độ lao động tăng lên 3 lần thì tổng giá trị hàng hoá là 900 USD", correct: true }] },
                    { type: "truefalse", text: "Câu 26: Trong 8 giờ công nhân sản xuất được 200 sản phẩm có tổng giá trị là 400 USD. Chọn đáp án (Đúng hoặc Sai) với từng trường hợp sau:", items: [{ text: "Nếu năng suất lao động tăng lên 2 lần thì tổng giá trị hàng hoá là 400 USD", correct: true }, { text: "Nếu cường độ lao động tăng lên 2 lần thì tổng giá trị hàng hoá là 800 USD", correct: true }, { text: "Nếu năng suất lao động tăng lên 3 lần thì tổng giá trị hàng hoá là 1.200 USD", correct: false }, { text: "Nếu cường độ lao động tăng lên 3 lần thì tổng giá trị hàng hoá là 400 USD", correct: false }] },
                    { type: "single", text: "Câu 27: Chọn 1 phương án trả lời đúng nhất. Một nghệ sĩ vẽ tranh kỹ thuật số và bán trên nền tảng blockchain. Theo anh/chị, tranh kỹ thuật số này có thể được coi là hàng hóa không?", opts: ["A. Không. Vì không có hình thái vật chất cụ thể", "B. Không. Vì công nghệ blockchain chưa được pháp lý công nhận", "C. Có. Vì đó là sản phẩm của trí tuệ", "D. Có. Vì nó được tạo ra từ lao động, có giá trị sử dụng và có thể trao đổi mua bán"], correct: 3 },
                    { type: "multi", text: "Câu 28: Chọn 3 phương án trả lời đúng. Những hình thức nào sau đây là biểu hiện của giá trị thặng dư?", opts: ["A. Lợi nhuận thương nghiệp", "B. Lợi nhuận", "C. Chi phí sản xuất", "D. Lợi tức"], correct: [1, 2, 3], required: 3 },
                    { type: "multi", text: "Câu 29: Chọn 3 phương án trả lời đúng. Phương pháp trừu tượng hóa khoa học trong nghiên cứu Kinh tế chính trị Mác - Lênin có đặc điểm là:", opts: ["A. Tách ra và đi sâu vào phân tích những hiện tượng, yếu tố điển hình, bền vững, tất nhiên, ổn định", "B. Tạm thời gạt bỏ khỏi đối tượng nghiên cứu những yếu tố ngẫu nhiên, tạm thời, không ổn định", "C. Xây dựng mô hình lý luận dựa trên bản chất phổ biến của các quan hệ văn hóa xã hội", "D. Đưa ra mô hình toán học dự đoán thị trường ngắn hạn"], correct: [0, 1, 2], required: 3 }
                ]

2: {
    name: "BÀI 2: LÝ LUẬN CỦA C.MÁC VỀ GIÁ TRỊ THẶNG DƯ",
    questions: [
        // CÂU 1 ĐÁP ÁN
        { type: "single", text: "Câu 1: Khi nào tiền tệ biến thành tư bản?", opts: ["A. Dùng tiền đầu tư vào sản xuất kinh doanh", "B. Sức lao động trở thành hàng hóa", "C. Có lượng tiền tệ đủ lớn", "D. Dùng tiền để buôn bán mua rẻ, bán đắt"], correct: 1 },
        { type: "single", text: "Câu 2: Nguồn gốc chủ yếu của tích lũy tư bản là:", opts: ["A. Tiền đi vay", "B. Sản phẩm thặng dư", "C. Giá trị thặng dư", "D. Tiền huy động"], correct: 2 },
        { type: "single", text: "Câu 3: Ý nào đúng nhất về tư bản bất biến (c) là?", opts: ["A. Giá trị của nó chuyển dần vào sản phẩm qua khấu hao", "B. Giá trị của nó lớn lên trong quá trình sản xuất", "C. Giá trị của nó không thay đổi và được chuyển ngay sang sản phẩm sau một chu kỳ sản xuất", "D. Giá trị của nó không thay đổi về lượng và được chuyển nguyên vẹn sang sản phẩm"], correct: 3 },
        { type: "single", text: "Câu 4: Tỷ suất giá trị thặng dư (m') phản ánh điều gì?", opts: ["A. Trình độ bóc lột của tư bản đối với công nhân làm thuê", "B. Số lượng giá trị thặng dư", "C. Quy mô bóc lột của nhà tư bản đối với người công nhân làm thuê", "D. Hiệu quả của nhà tư bản"], correct: 0 },
        { type: "single", text: "Câu 5: Dựa vào căn cứ nào để chia tư bản thành tư bản bất biến và tư bản khả biến?", opts: ["A. Hao mòn hữu hình hoặc vô hình", "B. Phương thức chuyển giá trị các bộ phận tư bản sang sản phẩm", "C. Tốc độ chu chuyển của tư bản", "D. Vai trò các bộ phận tư bản trong quá trình sản xuất giá trị thặng dư"], correct: 3 },
        { type: "single", text: "Câu 6: Dựa vào căn cứ nào để chia tư bản ra thành tư bản cố định và tư bản lưu động?", opts: ["A. Sự thay đổi về lượng trong quá trình sản xuất", "B. Vai trò các bộ phận tư bản trong quá trình sản xuất giá trị thặng dư", "C. Phương thức chuyển giá trị của các bộ phận tư bản sang sản phẩm", "D. Tốc độ chu chuyển chung của tư bản"], correct: 2 },
        { type: "single", text: "Câu 7: Giá trị thặng dư là gì?", opts: ["A. Giá trị của tư bản tự tăng lên", "B. Hiệu số giữa giá trị hàng hoá với chi phí sản xuất tư bản chủ nghĩa", "C. Phần giá trị mới dôi ra ngoài giá trị sức lao động do người công nhân làm thuê tạo ra", "D. Lợi nhuận thu được của người sản xuất kinh doanh"], correct: 2 },

function restoreWordQuestionOrder() {
    const topics = DATA.chuNghiaXaHoi.topics;

    const topic3 = topics[3].questions;
    topics[3].questions = topic3.filter(q => !q.text.includes("Nội dung cơ bản nhất mà nhờ đó chủ nghĩa xã hội từ không tưởng trở thành khoa học"));
    const topic3Questions = topics[3].questions;
    const relationIndex = topic3Questions.findIndex(q => q.text.includes("mối quan hệ giữa dân chủ xã hội chủ nghĩa và nhà nước xã hội chủ nghĩa"));
    if (!topic3Questions.some(q => q.text.includes("thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu"))) {
        topic3Questions.splice(relationIndex, 0, {
            type: "single",
            text: "Câu 11: Vận dụng những kiến thức đã học hãy cho biết việc thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu và thực hiện chế độ phân phối lợi ích theo kết quả lao động là chủ yếu là bản chất kinh tế của nền dân chủ nào?",
            opts: ["A. Nền dân chủ tư sản", "B. Nền dân chủ chủ nô", "C. Nền dân chủ nguyên thủy", "D. Nền dân chủ xã hội chủ nghĩa"],
            correct: 3
        });
    }
    const topic4Questions = topics[4].questions;
    if (!topic4Questions.some(q => q.text.startsWith("Câu 39:"))) {
        topic4Questions.push({
            type: "drag",
            text: "Câu 39: Kéo thả các khái niệm khớp với các phát biểu về cơ cấu xã hội - giai cấp ở Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội dưới đây:",
            items: ["Lực lượng mới trong cơ cấu xã hội – giai cấp:", "Giai cấp trung tâm trong cơ cấu xã hội – giai cấp:", "Chính sách hỗ trợ cơ cấu xã hội - giai cấp:", "Lực lượng quan trọng trong cơ cấu xã hội - giai cấp:"],
            draggables: ["Đội ngũ doanh nhân", "Giai cấp công nhân", "Chính sách an sinh xã hội", "Đội ngũ trí thức"],
            matches: [["Đội ngũ doanh nhân"], ["Giai cấp công nhân"], ["Chính sách an sinh xã hội"], ["Đội ngũ trí thức"]]
        });
        topic4Questions.push({
            type: "drag",
            text: "Câu 40: Kéo thả các yếu tố liên quan đến liên minh giai cấp, tầng lớp ở Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội vào các cột tương ứng.",
            items: ["1. Thành phần/yếu tố của liên minh:", "2. Nội dung/phương hướng của liên minh:"],
            draggables: ["Giai cấp công nhân", "Giai cấp nông dân", "Tầng lớp phụ nữ", "Đảng Cộng sản", "Nội dung chính trị", "Nội dung kinh tế", "Xóa đói giảm nghèo", "Tăng cường liên minh"],
            matches: [["Giai cấp công nhân", "Giai cấp nông dân", "Tầng lớp phụ nữ", "Đảng Cộng sản"], ["Nội dung chính trị", "Nội dung kinh tế", "Xóa đói giảm nghèo", "Tăng cường liên minh"]]
        });
    }

    const topic5 = topics[5].questions;
    const misplaced28 = topic5.find(q => q.text.startsWith("CÂU 11: Tại sao ngày nay khoa học"));
    if (misplaced28) topic5.splice(topic5.indexOf(misplaced28), 1);
    const tailQuestions = topic5.filter(q => /^C(?:ÂU|âu) (28|29|30):/.test(q.text));
    for (const question of tailQuestions) topic5.splice(topic5.indexOf(question), 1);
    const tfIndex = topic5.findIndex(q => q.text.startsWith("Câu 31:"));
    if (tfIndex >= 0) topic5.splice(tfIndex, 0, ...tailQuestions);
    const q14Index = topic5.findIndex(q => q.text.includes("Vận dụng kiến thức về đặc điểm tôn giáo ở Việt Nam"));
    if (!topic5.some(q => q.text.includes("Quá trình phát triển của dân tộc trải qua mấy hình thức cộng đồng người"))) {
        topic5.splice(q14Index, 0, {
            type: "single",
            text: "Câu 13: Quá trình phát triển của dân tộc trải qua mấy hình thức cộng đồng người?",
            opts: ["A. 4", "B. 5", "C. 2", "D. 3"],
            correct: 0
        });
    }
    if (!topic5.some(q => q.text.startsWith("Câu 41:"))) {
        topic5.push({
            type: "drag",
            text: "Câu 41: Kéo thả các đáp án đúng tương ứng với các phát biểu về dân tộc dưới đây:",
            items: ["Đặc trưng quan trọng nhất của dân tộc là gì?", "Khái niệm dân tộc theo nghĩa hẹp được gọi là gì?", "Nội dung cơ bản của cương lĩnh dân tộc Mác-Lênin là gì?", "Yếu tố thiêng liêng đối với dân tộc (quốc gia) và từng thành viên dân tộc là gì?"],
            draggables: ["Phương thức sinh hoạt kinh tế chung", "Dân tộc tộc người", "Bình đẳng dân tộc", "Lãnh thổ"],
            matches: [["Phương thức sinh hoạt kinh tế chung"], ["Dân tộc tộc người"], ["Bình đẳng dân tộc"], ["Lãnh thổ"]]
        });
    }

    for (const topicId of [3, 4, 5]) {
        topics[topicId].questions.forEach((question, index) => {
            question.text = question.text.replace(/^C(?:ÂU|âu)\s+\d+:/, `Câu ${index + 1}:`);
        });
    }
}
